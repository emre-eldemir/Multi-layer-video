<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Layered Video Media Player</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>" />
</head>
<body>
  <div id="app" class="d-flex flex-column vh-100 overflow-hidden">
    <!-- Top Toolbar -->
    <header id="toolbar" class="toolbar"></header>

    <!-- Main Content Area -->
    <main class="d-flex flex-grow-1 overflow-hidden">
      <!-- Left: Layers Panel -->
      <aside id="layers-panel" class="side-panel left-panel d-flex flex-column"></aside>

      <!-- Center: Player Canvas -->
      <section class="player-area d-flex flex-column flex-grow-1 overflow-hidden">
        <div class="canvas-wrapper d-flex align-items-center justify-content-center flex-grow-1 p-3 overflow-hidden">
          <canvas id="player-canvas"></canvas>
        </div>

        <!-- Timeline Slider -->
        <div class="timeline-bar d-flex align-items-center gap-3 px-3 py-2">
          <input type="range" id="timeline-slider" class="form-range flex-grow-1" min="0" max="30000" value="0" step="33" />
          <span id="time-display" class="time-display text-secondary small font-monospace text-nowrap">0:00 / 0:00</span>
        </div>
      </section>

      <!-- Right: Inspector Panel -->
      <aside id="inspector-panel" class="side-panel right-panel d-flex flex-column"></aside>
    </main>

    <!-- Status Bar -->
    <footer class="status-bar d-flex align-items-center px-3">
      <small id="status-bar" class="text-secondary">Ready</small>
    </footer>
  </div>

  <script type="module" src="./main.ts"></script>
</body>
</html>
